
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Deal Town U10 Hoops - Login
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="login-container">

        <img
            src="team-logo.png"
            alt="Deal Town U10 Hoops"
            class="team-logo"
        >


        <h1>
            DEAL TOWN
        </h1>


        <h2>
            U10 HOOPS
        </h2>


        <p>
            TEAM TRACKER
        </p>


        <form
            id="loginForm"
        >

            <label
                for="accessCode"
            >
                ACCESS CODE
            </label>


            <input
                type="password"
                id="accessCode"
                placeholder="Enter access code"
                autocomplete="off"
                required
            >


            <button
                type="submit"
            >
                LOGIN
            </button>


            <p
                id="errorMessage"
            ></p>

        </form>

    </main>


    <script
        src="js/auth.js"
    ></script>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();

                    login();

                }
            );

    </script>

</body>

</html>
